name: AU-UN Job Crawler

on:
  schedule:
    - cron: '0 9 * * 1'    # Every Monday at 9:00 UTC (approx 10:00 WAT)
  workflow_dispatch:       # Allows manual trigger from GitHub UI

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests playwright
          playwright install --with-deps chromium

      - name: Run crawler
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crawler.py

      - name: Commit updated seen jobs (if changed)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add jobs_seen.db
          git diff --quiet && git diff --staged --quiet || git commit -m "Update seen jobs"
          git push
        continue-on-error: true
